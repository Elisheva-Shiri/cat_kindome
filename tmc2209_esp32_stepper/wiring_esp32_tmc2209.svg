<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title{font:700 34px Arial, sans-serif;fill:#17202a}.label{font:600 20px Arial, sans-serif;fill:#17202a}.small{font:16px Arial, sans-serif;fill:#17202a}.tiny{font:14px Arial, sans-serif;fill:#17202a}.pin{font:700 16px Arial, sans-serif;fill:#fff}.box{fill:#f8fbff;stroke:#263238;stroke-width:3;rx:18}.driver{fill:#fff7e6;stroke:#263238;stroke-width:3;rx:18}.motor{fill:#f4fff4;stroke:#263238;stroke-width:3;rx:18}.psu{fill:#fff0f0;stroke:#263238;stroke-width:3;rx:18}.wire-red{stroke:#d32f2f;stroke-width:6;fill:none}.wire-black{stroke:#111;stroke-width:6;fill:none}.wire-blue{stroke:#1976d2;stroke-width:5;fill:none}.wire-green{stroke:#2e7d32;stroke-width:5;fill:none}.wire-purple{stroke:#7b1fa2;stroke-width:5;fill:none}.wire-orange{stroke:#f57c00;stroke-width:5;fill:none}.wire-gray{stroke:#607d8b;stroke-width:5;fill:none;stroke-dasharray:10 8}.note{fill:#fffde7;stroke:#f9a825;stroke-width:2;rx:12}.pinbox{fill:#455a64;stroke:#263238;stroke-width:1;rx:5}.cap{fill:#e1f5fe;stroke:#0277bd;stroke-width:3;rx:8}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#263238"/></marker>
  </defs>

  <text x="40" y="55" class="title">ESP32 + MKS TMC2209 V2.0 wiring for one 4-wire stepper motor</text>
  <text x="40" y="88" class="small">STEP/DIR mode, slow 20° forward + 20° back, 10 seconds total loop</text>

  <!-- ESP32 -->
  <rect x="80" y="170" width="300" height="430" class="box"/>
  <text x="140" y="215" class="label">ESP32 Dev Board</text>
  <rect x="310" y="250" width="50" height="30" class="pinbox"/><text x="318" y="271" class="pin">3V3</text>
  <rect x="310" y="300" width="50" height="30" class="pinbox"/><text x="319" y="321" class="pin">GND</text>
  <rect x="310" y="365" width="50" height="30" class="pinbox"/><text x="320" y="386" class="pin">25</text>
  <rect x="310" y="415" width="50" height="30" class="pinbox"/><text x="320" y="436" class="pin">26</text>
  <rect x="310" y="465" width="50" height="30" class="pinbox"/><text x="320" y="486" class="pin">27</text>
  <text x="120" y="272" class="small">3.3 V logic</text>
  <text x="120" y="322" class="small">common ground</text>
  <text x="120" y="387" class="small">EN enable</text>
  <text x="120" y="437" class="small">DIR direction</text>
  <text x="120" y="487" class="small">STEP pulses</text>

  <!-- Driver -->
  <rect x="560" y="145" width="360" height="510" class="driver"/>
  <text x="610" y="190" class="label">MKS TMC2209 V2.0</text>
  <text x="640" y="220" class="small">StepStick driver module</text>

  <!-- Driver left pins control -->
  <rect x="560" y="250" width="70" height="30" class="pinbox"/><text x="579" y="271" class="pin">VIO</text>
  <rect x="560" y="300" width="70" height="30" class="pinbox"/><text x="578" y="321" class="pin">GND</text>
  <rect x="560" y="365" width="70" height="30" class="pinbox"/><text x="583" y="386" class="pin">EN</text>
  <rect x="560" y="415" width="70" height="30" class="pinbox"/><text x="581" y="436" class="pin">DIR</text>
  <rect x="560" y="465" width="70" height="30" class="pinbox"/><text x="573" y="486" class="pin">STEP</text>
  <rect x="560" y="525" width="70" height="30" class="pinbox"/><text x="578" y="546" class="pin">MS1</text>
  <rect x="560" y="570" width="70" height="30" class="pinbox"/><text x="578" y="591" class="pin">MS2</text>

  <!-- Driver right pins power/motor -->
  <rect x="850" y="250" width="70" height="30" class="pinbox"/><text x="875" y="271" class="pin">VM</text>
  <rect x="850" y="300" width="70" height="30" class="pinbox"/><text x="867" y="321" class="pin">GND</text>
  <rect x="850" y="395" width="70" height="30" class="pinbox"/><text x="865" y="416" class="pin">M1A</text>
  <rect x="850" y="440" width="70" height="30" class="pinbox"/><text x="865" y="461" class="pin">M1B</text>
  <rect x="850" y="500" width="70" height="30" class="pinbox"/><text x="865" y="521" class="pin">M2A</text>
  <rect x="850" y="545" width="70" height="30" class="pinbox"/><text x="865" y="566" class="pin">M2B</text>

  <text x="650" y="548" class="tiny">Tie MS1/MS2 to 3V3 for 16 microsteps</text>
  <text x="650" y="590" class="tiny">or set jumpers and update MICROSTEPS in code</text>

  <!-- PSU -->
  <rect x="1030" y="160" width="270" height="190" class="psu"/>
  <text x="1090" y="205" class="label">12 V PSU</text>
  <text x="1085" y="235" class="small">or 24 V if motor/driver allow</text>
  <rect x="1055" y="270" width="70" height="34" class="pinbox"/><text x="1073" y="293" class="pin">+V</text>
  <rect x="1055" y="315" width="70" height="34" class="pinbox"/><text x="1070" y="338" class="pin">-V</text>

  <!-- Capacitor -->
  <rect x="975" y="375" width="210" height="95" class="cap"/>
  <text x="995" y="408" class="label">≥100 µF</text>
  <text x="995" y="435" class="small">electrolytic capacitor</text>
  <text x="995" y="459" class="tiny">across VM and GND near driver</text>

  <!-- Motor -->
  <rect x="1030" y="520" width="290" height="250" class="motor"/>
  <circle cx="1175" cy="640" r="62" fill="#e8f5e9" stroke="#2e7d32" stroke-width="5"/>
  <circle cx="1175" cy="640" r="22" fill="#c8e6c9" stroke="#2e7d32" stroke-width="4"/>
  <text x="1090" y="560" class="label">4-wire Stepper</text>
  <text x="1060" y="732" class="small">Find coil pairs with a multimeter.</text>
  <text x="1060" y="756" class="small">One pair = M1A/M1B, other = M2A/M2B.</text>

  <!-- Wires ESP to Driver -->
  <path d="M360 265 C430 265, 490 265, 560 265" class="wire-red"/><text x="410" y="250" class="tiny">ESP32 3V3 → VIO</text>
  <path d="M360 315 C430 315, 490 315, 560 315" class="wire-black"/><text x="410" y="300" class="tiny">GND → GND</text>
  <path d="M360 380 C430 380, 490 380, 560 380" class="wire-purple"/><text x="410" y="365" class="tiny">GPIO25 → EN</text>
  <path d="M360 430 C430 430, 490 430, 560 430" class="wire-green"/><text x="410" y="415" class="tiny">GPIO26 → DIR</text>
  <path d="M360 480 C430 480, 490 480, 560 480" class="wire-blue"/><text x="410" y="465" class="tiny">GPIO27 → STEP</text>

  <!-- MS jumpers -->
  <path d="M630 540 C690 540, 710 265, 630 265" class="wire-gray"/>
  <path d="M630 585 C720 585, 745 265, 630 265" class="wire-gray"/>

  <!-- PSU to Driver -->
  <path d="M1055 287 C1010 287, 970 265, 920 265" class="wire-red"/><text x="940" y="246" class="tiny">+12 V → VM</text>
  <path d="M1055 332 C1000 332, 970 315, 920 315" class="wire-black"/><text x="940" y="350" class="tiny">PSU -V → GND</text>

  <!-- common ground connection from driver to ESP32 already; show note -->
  <path d="M850 315 C760 735, 360 735, 310 315" class="wire-black" opacity="0.35"/>
  <text x="430" y="760" class="small">Important: ESP32 GND, driver GND, and PSU -V must be common.</text>

  <!-- capacitor connection -->
  <path d="M975 398 C935 360, 930 275, 920 265" class="wire-red"/>
  <path d="M975 450 C940 430, 930 330, 920 315" class="wire-black"/>

  <!-- Motor wires -->
  <path d="M920 410 C980 410, 1005 585, 1060 600" class="wire-orange"/><text x="935" y="398" class="tiny">coil A</text>
  <path d="M920 455 C975 455, 1005 610, 1060 625" class="wire-orange"/>
  <path d="M920 515 C980 515, 1005 665, 1060 680" class="wire-blue"/><text x="935" y="505" class="tiny">coil B</text>
  <path d="M920 560 C975 560, 1005 690, 1060 705" class="wire-blue"/>

  <!-- Notes -->
  <rect x="80" y="680" width="430" height="145" class="note"/>
  <text x="105" y="715" class="label">Before powering</text>
  <text x="105" y="747" class="small">1. Set driver current/Vref for your motor.</text>
  <text x="105" y="775" class="small">2. Check coil pairs; wrong pairs cause vibration.</text>
  <text x="105" y="803" class="small">3. Never unplug motor while VM is powered.</text>

  <rect x="560" y="700" width="360" height="125" class="note"/>
  <text x="585" y="735" class="label">Code values</text>
  <text x="585" y="765" class="small">GPIO25 EN, GPIO26 DIR, GPIO27 STEP</text>
  <text x="585" y="793" class="small">200 full-steps/rev, 16 microsteps</text>
</svg>
